{% extends "base.html" %}

{% block title %}Contraseña actualizada | Comervial{% endblock %}

{% block content %}
<div class="container py-5" style="min-height: 70vh; display: flex; align-items: center;">
  <div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4 p-md-5">
          
          <div class="mb-4 text-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
              <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
          </div>

          <h2 class="h4 fw-bold mb-3">¡Contraseña cambiada!</h2>
          <p class="text-muted mb-4">
            Tu contraseña ha sido actualizada correctamente. Ya puedes acceder a tu cuenta con tus nuevas credenciales.
          </p>
          
          <div class="d-grid gap-2">
            <a href="{% url 'login' %}" class="btn btn-dark btn-lg">Iniciar sesión</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
